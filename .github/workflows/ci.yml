name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Validate & Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Verify Architecture & Boundary Rules
        run: npm run check:architecture

      - name: Type Check (TypeScript compiler validation)
        run: npm run type-check

      - name: Run Test Suite (520+ tests)
        run: npm test

      - name: Build Package (TSup ESM + Type Definitions)
        run: npm run build
